name: Plugin security scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@56b13fc89ffb828b4dfeff515a2458cdfeda1224 # v1.2.728
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
