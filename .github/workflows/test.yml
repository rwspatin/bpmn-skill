name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Unit tests
        run: node --test skill/scripts/*.test.mjs
      - name: Examples validate and lint clean
        run: |
          for f in skill/examples/order-fulfillment.mmd skill/examples/media-viewer-upload.mmd; do
            node skill/scripts/validate.mjs "$f"
            node skill/scripts/lint.mjs "$f"
          done
